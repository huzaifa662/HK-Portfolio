<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback: unknown paths redirect to the app root
      // while preserving any hash-based route.
      sessionStorage.ghPagesRedirect =
        location.pathname.replace(/\/[^/]*$/, '/') + location.search + location.hash
      location.replace('./index.html')
    </script>
  </head>
  <body></body>
</html>
